services:
  ecr-services-usermanagement:
    image: ecr-usermanagement-api
    build:
      context: .
      dockerfile: src/Services/UserManagement/UserManagement.Api/Dockerfile
    env_file: .ci/services.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:5002
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:5002/diagnostic/healthcheck" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "5002:5002"
    networks:
      - ecr-services
      - common-infrastructure

  ecr-services-remoteconfig:
    image: ecr-remoteconfig-api
    build:
      context: .
      dockerfile: src/Services/RemoteConfig/RemoteConfig.Api/Dockerfile
    env_file: .ci/services.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:5003
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:5003/diagnostic/healthcheck" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "5003:5003"
    networks:
      - ecr-services
      - common-infrastructure

networks:
  ecr-services:
    external: true
  common-infrastructure:
    external: true