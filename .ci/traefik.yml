services:
  traefik:
    image: traefik:latest
    restart: always
    container_name: "traefik"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    command:
      - --api.dashboard=true
      - --accessLog=true
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entrypoint.to=webSecure
      - --entryPoints.web.http.redirections.entrypoint.scheme=https
      - --entryPoints.webSecure.address=:443
      - --entryPoints.webSecure.asDefault=true
      - --entryPoints.webSecure.http.tls.certResolver=myResolver
      - --certificatesResolvers.myResolver.acme.email=r.molotov@yahoo.com
      - --certificatesResolvers.myResolver.acme.tlsChallenge=true
      - --certificatesResolvers.myResolver.acme.storage=/letsencrypt/acme.json
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.entryPoints=web
      - traefik.http.routers.web.rule=Host(`electrical-contact-resistance.ru`)
      - traefik.http.routers.web.tls=true
      - traefik.http.routers.web.tls.certResolver=myResolver
      - traefik.http.routers.dashboard.rule=Host(`traefik.electrical-contact-resistance.ru`)
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.middlewares=myAuth
      - traefik.http.services.traefik.loadBalancer.server.port=80
      - traefik.http.middlewares.traefik-compress.compress=true
      - traefik.http.middlewares.myAuth.basicAuth.users=test:$$apr1$$H6uskkkW$$IgXLP6ewTrSuBkTrqE8wj/

volumes:
  letsencrypt:

networks:
  default:
    name: traefik
    external: true