services:
  postgres:
    image: postgres:18
    container_name: postgres
    env_file: .ci/databases.env
    environment:
      POSTGRES_USER: postgres
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - common-infrastructure
    
  mongo:
    image: mongo
    container_name: mongo
    env_file: .ci/databases.env
    restart: always
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - common-infrastructure
    
  redis:
    image: redis
    container_name: redis
    env_file: .ci/databases.env
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    ports:
      - "6379:6379"
    networks:
      - common-infrastructure

volumes:
  mongo_data:
  postgres_data:
    
networks:
  common-infrastructure:
    external: true
