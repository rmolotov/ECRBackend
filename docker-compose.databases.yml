services:
  ecr-databases-postgres:
    image: postgres:18
    container_name: ecr-databases-postgres
    env_file: .ci/databases.env
    environment:
      POSTGRES_USER: postgres
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - ecr-db
    
  ecr-databases-mongo:
    image: mongo
    container_name: ecr-databases-mongo
    env_file: .ci/databases.env
    restart: always
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ecr-db
    
  ecr-databases-redis:
    image: redis
    container_name: ecr-databases-redis
    env_file: .ci/databases.env
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    ports:
      - "6379:6379"
    networks:
      - ecr-db

volumes:
  mongo_data:
  postgres_data:
    
networks:
  ecr-db:
    external: true
